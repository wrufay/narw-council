services:
  - type: web
    name: narw-council
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
    healthCheckPath: /health

# Frontend is deployed via Vercel (see frontend/vercel.json), not Render -
# this file only covers the backend.
